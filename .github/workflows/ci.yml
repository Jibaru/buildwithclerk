name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm registry:check
      - run: pnpm test
      # Turborepo only runs tasks for packages touched since the base commit.
      - run: pnpm turbo run typecheck build --filter='...[HEAD^1]'
        env:
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_Y2xlcmsuYnVpbGR3aXRoY2xlcmsuY2kk
          CLERK_SECRET_KEY: sk_test_ci_placeholder
          SITE_URL: https://buildwithclerk.com
