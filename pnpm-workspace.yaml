packages:
  - apps/*
  - packages/*
  # JS/TS examples opt in by having a package.json; non-JS examples
  # (Godot, Go, Python) live in examples/ without one and are ignored here.
  - examples/*

allowBuilds:
  '@biomejs/biome': true
  '@clerk/shared': true
  '@parcel/watcher': true
  '@swc/core': true
  esbuild: true
  sharp: true

autoInstallPeers: true
strictPeerDependencies: false
